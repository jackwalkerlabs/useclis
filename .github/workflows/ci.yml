name: Validate site
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://useclis.com
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run check:design-system
      - run: npm run build
      - run: npm run check:links
      - run: npx wrangler deploy --dry-run
      - name: Deploy current main to useclis.com
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$GITHUB_SHA" != "$current_main" ]; then
            echo "Skipping superseded commit $GITHUB_SHA; main is now $current_main."
            exit 0
          fi
          npx wrangler deploy
          node scripts/check-http.mjs https://useclis.com
