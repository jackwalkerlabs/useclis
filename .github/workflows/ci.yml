name: Validate site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://useclis.com
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run check:design-system
      - run: npm run build
      - run: npm run check:links
      - run: npm run check:agent-api
      - name: Install smoke-test browser
        run: npx playwright install --with-deps chromium
      - name: Smoke test the built site
        run: npm run test:smoke
        env:
          SMOKE_LOCAL: '1'
          SMOKE_EXPECTED_SHA: ${{ github.sha }}
      - name: Save built-site smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: built-site-smoke
          path: |
            artifacts/smoke-report/
            artifacts/smoke-results/
          retention-days: 14
          if-no-files-found: ignore
      - run: npx wrangler deploy --dry-run
      - run: npx wrangler deploy --dry-run --config workers/discovery/wrangler.jsonc
      - name: Deploy current main to useclis.com
        id: deploy
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$GITHUB_SHA" != "$current_main" ]; then
            echo "Skipping superseded commit $GITHUB_SHA; main is now $current_main."
            exit 0
          fi
          npx wrangler deploy
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Smoke test production
        if: steps.deploy.outputs.deployed == 'true'
        run: npm run test:smoke
        env:
          SMOKE_BASE_URL: https://useclis.com
          SMOKE_EXPECTED_SHA: ${{ github.sha }}
      - name: Save production smoke report
        if: always() && steps.deploy.outputs.deployed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-smoke
          path: |
            artifacts/smoke-report/
            artifacts/smoke-results/
          retention-days: 14
          if-no-files-found: ignore
