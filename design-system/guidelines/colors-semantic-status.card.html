<!-- @dsCard group="Colors" viewport="700x160" name="Status colors" subtitle="Source, featured, growth up/down" -->
<meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font:var(--text-body-default);display:flex;flex-direction:column;justify-content:center}</style>
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
<span style="display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:var(--radius-pill);background:var(--source-bg);color:var(--source-fg);font:var(--fw-semibold) var(--fs-sm)/1.2 var(--font-sans)"><span style="width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--source-dot);color:#fff;font-size:9px;font-weight:800">✓</span>Data from GitHub</span>
<span style="padding:3px 8px;border-radius:var(--radius-sm);background:var(--featured-bg);color:var(--featured-fg);font:var(--text-caps);letter-spacing:var(--tracking-caps);text-transform:uppercase">Featured</span>
<span style="font:var(--fw-semibold) var(--fs-body)/1 var(--font-mono);color:var(--growth-up)">▲ +11%</span>
<span style="font:var(--fw-semibold) var(--fs-body)/1 var(--font-mono);color:var(--growth-down)">▼ -4%</span>
<span style="font:var(--fw-semibold) var(--fs-body)/1 var(--font-mono);color:var(--growth-flat)">– 0%</span>
</div>
<div style="margin-top:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:var(--radius-md);background:var(--source-fg);border:1px solid var(--border-subtle)"></div><div style="font:var(--fw-semibold) var(--fs-xs)/1.2 var(--font-sans);color:var(--text-strong)">source</div><div style="font:var(--fw-regular) 10px/1.2 var(--font-mono);color:var(--text-muted)">--source-fg</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:var(--radius-md);background:var(--featured-fg);border:1px solid var(--border-subtle)"></div><div style="font:var(--fw-semibold) var(--fs-xs)/1.2 var(--font-sans);color:var(--text-strong)">featured</div><div style="font:var(--fw-regular) 10px/1.2 var(--font-mono);color:var(--text-muted)">--featured-fg</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:var(--radius-md);background:var(--growth-up);border:1px solid var(--border-subtle)"></div><div style="font:var(--fw-semibold) var(--fs-xs)/1.2 var(--font-sans);color:var(--text-strong)">up</div><div style="font:var(--fw-regular) 10px/1.2 var(--font-mono);color:var(--text-muted)">--growth-up</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:var(--radius-md);background:var(--growth-down);border:1px solid var(--border-subtle)"></div><div style="font:var(--fw-semibold) var(--fs-xs)/1.2 var(--font-sans);color:var(--text-strong)">down</div><div style="font:var(--fw-regular) 10px/1.2 var(--font-mono);color:var(--text-muted)">--growth-down</div></div></div>
