<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>useclis design system</title><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;color:var(--text-body);background:var(--surface-page)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--green-600);outline-offset:4px}.kit-header,.kit-footer,main{max-width:1152px;margin:auto;padding:24px}.kit-header{display:flex;align-items:center;justify-content:space-between;gap:24px}.kit-wordmark{display:flex;align-items:center;gap:8px;font-size:26px;font-weight:700;letter-spacing:-1px;color:var(--text-strong)}.kit-wordmark span{color:var(--green-600);margin-left:-7px}nav{display:flex;gap:16px;flex-wrap:wrap}nav button{color:var(--text-strong);background:none;border:0;padding:8px}.kit-hero{text-align:center;padding:50px 0}.kit-hero h1{font:var(--text-display);letter-spacing:var(--tracking-display)}.kit-hero p{margin:20px 0}.kit-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.kit-filters{display:flex;gap:24px;flex-wrap:wrap;margin:24px 0}.kit-detail{max-width:760px;margin:auto;display:flex;flex-direction:column;gap:20px}.kit-detail pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:var(--surface-sunken);border-radius:8px}.kit-footer{margin-top:48px;border-top:1px solid var(--border-subtle)}.kit-footer small{display:block;margin-top:8px;color:var(--text-muted)}@media(max-width:900px){.kit-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.kit-grid{grid-template-columns:1fr}.kit-header{align-items:flex-start;flex-direction:column}.kit-hero h1{font-size:40px}}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><script src="data.js"></script></head><body><div id="root"></div>
<script type="text/babel" src="AppShell.jsx"></script><script type="text/babel" src="HomeScreen.jsx"></script><script type="text/babel" src="DirectoryScreen.jsx"></script><script type="text/babel" src="ToolScreen.jsx"></script>
<script type="text/babel">
function App(){const[route,setRoute]=React.useState("home"),[tool,setTool]=React.useState(null),[dark,setDark]=React.useState(false);React.useEffect(()=>{document.documentElement.dataset.theme=dark?"dark":""},[dark]);const open=t=>{setTool(t);setRoute("tool")};return <><Header go={setRoute} dark={dark} setDark={setDark}/><main>{route==="home"&&<HomeScreen go={setRoute} open={open}/>} {route==="directory"&&<DirectoryScreen open={open}/>} {route==="tool"&&tool&&<ToolScreen tool={tool} back={()=>setRoute("directory")}/>}</main><Footer/></>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
